name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    # Only pre-release tags (v2.0.1-beta1) build here. CI has no signing key, so a full release is built and
    # published by hand with the master key: gh release create vX.Y.Z app-release.apk --notes-file ... --verify-tag --latest
    if: github.ref_type == 'tag' && contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x gradlew

      - name: Compute Tag
        run: echo "VERSION_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Decode Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "No signing secret configured; creating fallback debug keystore..."
            mkdir -p ~/.config/.android ~/.android
            keytool -genkeypair -v -keystore ~/.config/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.config/.android/debug.keystore ~/.android/debug.keystore
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK and AAB
        run: |
          # Tester builds are debug-signed on purpose when no signing secret exists; the flag makes that explicit.
          EXTRA=""
          if [ "${{ steps.keystore.outputs.has_keystore }}" != "true" ]; then EXTRA="-PallowDebugSigning"; fi
          ./gradlew assembleRelease bundleRelease $EXTRA
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Release ${{ env.VERSION_TAG }}
          prerelease: ${{ contains(env.VERSION_TAG, '-') }}   # v1.6.4-beta1 and the like are for testers
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
